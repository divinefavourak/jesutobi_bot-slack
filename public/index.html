<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlackOS — interactive demo</title>
<meta name="description" content="Try SlackOS without installing it. An AI teammate for Slack that turns plain sentences into tasks, memory and automations.">
<style>
:root{
  --ink:#16171A;
  --panel:#1E2024;
  --raise:#25272C;
  --rule:#33363C;
  --coral:#E8705A;
  --jade:#4FB286;
  --paper:#E9E7E4;
  --muted:#878C95;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono)}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column;max-width:1400px;margin:0 auto}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--rule);
  flex-wrap:wrap;
}
.mark{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
.glyph{
  width:26px;height:26px;border-radius:7px;background:var(--coral);
  display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:13px;
  font-family:var(--mono);flex:none;
}
.tag{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 9px;
}
.topbar .spacer{flex:1}
.toplink{
  color:var(--muted);text-decoration:none;font-size:13px;
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.toplink:hover{color:var(--paper);border-bottom-color:var(--coral)}

/* ---------- two-pane ---------- */
.panes{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
@media (max-width:900px){.panes{grid-template-columns:1fr;overflow-y:auto}}

/* ---------- channel ---------- */
.channel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.chanhead{padding:13px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px}
.channame{font-weight:650}
.chanmeta{color:var(--muted);font-size:12.5px}

.log{flex:1;overflow-y:auto;padding:18px 20px 8px;min-height:0;scroll-behavior:smooth}
@media (max-width:900px){.log{max-height:56vh}}

.msg{display:flex;gap:11px;padding:7px 0;animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;font-weight:700}
.av.bot{background:var(--coral);color:var(--ink)}
.av.you{background:var(--raise);color:var(--muted);border:1px solid var(--rule)}
.av.sys{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
.body{min-width:0;flex:1}
.who{display:flex;align-items:center;gap:7px;margin-bottom:1px}
.name{font-weight:650;font-size:14px}
.badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  background:var(--raise);border:1px solid var(--rule);border-radius:3px;
  padding:1px 4px;color:var(--muted);text-transform:uppercase;
}
.time{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.text{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.text code{background:var(--raise);border:1px solid var(--rule);border-radius:4px;padding:.5px 5px;font-size:12.5px}
.text strong{font-weight:650}
.mention{color:var(--coral);background:rgba(232,112,90,.13);border-radius:4px;padding:0 3px}
.foot{color:var(--muted);font-size:12.5px;margin-top:5px}
.memeimg{max-width:min(100%,340px);border-radius:8px;border:1px solid var(--rule);margin-top:7px;display:block}

/* system / event line */
.evt{
  display:flex;align-items:center;gap:10px;margin:14px 0 6px;
  color:var(--muted);font-size:12.5px;font-family:var(--mono);
  animation:rise .22s ease both;
}
.evt::before,.evt::after{content:"";height:1px;background:var(--rule);flex:1}
.evt span{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}
.evt.live span{border-color:var(--coral);color:var(--coral)}

/* dm bubble */
.dm{border-left:2px solid var(--coral);background:rgba(232,112,90,.06);border-radius:0 8px 8px 0;padding:8px 12px}
.dmlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--coral);margin-bottom:3px}

.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- composer ---------- */
.composer{padding:12px 20px 16px;border-top:1px solid var(--rule)}
.inputwrap{display:flex;gap:9px;align-items:center;background:var(--panel);
  border:1px solid var(--rule);border-radius:10px;padding:9px 12px;transition:border-color .15s}
.inputwrap:focus-within{border-color:var(--coral)}
.inputwrap input{
  flex:1;background:none;border:0;outline:none;color:var(--paper);
  font-family:var(--mono);font-size:14px;min-width:0;
}
.inputwrap input::placeholder{color:var(--muted)}
.send{background:var(--coral);color:var(--ink);border:0;border-radius:7px;
  padding:6px 13px;font-weight:650;font-size:13px}
.send:hover{filter:brightness(1.08)}
.send:disabled{opacity:.4;cursor:not-allowed}

.chips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.chip{
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;
  padding:5px 11px;font-family:var(--mono);font-size:12px;color:var(--muted);
  transition:.15s;
}
.chip:hover{border-color:var(--coral);color:var(--paper)}
.chip.fire{border-color:var(--coral);color:var(--coral)}
.chip.fire:hover{background:var(--coral);color:var(--ink)}

/* ---------- state rail ---------- */
.rail{background:var(--panel);overflow-y:auto;padding:16px 16px 28px;min-height:0}
@media (max-width:900px){.rail{border-top:1px solid var(--rule)}}
.railtop{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.railnote{color:var(--muted);font-size:12px;margin-bottom:16px;line-height:1.45}

.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:20px}
.count{background:var(--raise);border:1px solid var(--rule);border-radius:9px;padding:9px 10px}
.count b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}
.count span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--rule)}
.rows{margin:0 0 20px;display:flex;flex-direction:column;gap:5px}

.row{
  background:var(--raise);border:1px solid var(--rule);border-radius:8px;
  padding:7px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;
  transition:border-color .2s,background .2s;
}
.row .id{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-top:1px}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.row.done .lbl>span{text-decoration:line-through;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:6px}
.dot.on{background:var(--jade)}
.dot.off{background:var(--rule);border:1px solid var(--muted)}
.dot.pend{background:var(--coral)}
.row.flash{border-color:var(--coral);background:rgba(232,112,90,.11)}
.youcard{display:block;margin-bottom:14px;padding:10px 12px}
.youcard .lvl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.youcard .lvl b{font-size:13px;font-weight:650}
.youcard .lvl span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.youcard .bar{font-family:var(--mono);font-size:12px;color:var(--coral);letter-spacing:1px;margin-top:5px}
.youcard .sub{font-size:11px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);font-size:12px;font-style:italic;padding:4px 2px}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="mark"><span class="glyph">S</span> SlackOS</div>
    <span class="tag">interactive demo</span>
    <div class="spacer"></div>
    <a class="toplink" href="https://github.com/divinefavourak/jesutobi_bot-slack" target="_blank" rel="noopener">Source on GitHub</a>
  </header>

  <div class="panes">

    <section class="channel">
      <div class="chanhead">
        <span class="channame"># bot-spam</span>
        <span class="chanmeta">SlackOS is a member of this channel</span>
      </div>

      <div class="log" id="log" role="log" aria-live="polite" aria-label="Channel messages"></div>

      <div class="composer">
        <form class="inputwrap" id="form" autocomplete="off">
          <label for="input" class="sr-only" style="position:absolute;left:-9999px">Message #bot-spam</label>
          <input id="input" placeholder="Message #bot-spam — try /sos-help" autocomplete="off">
          <button class="send" type="submit" id="send">Send</button>
        </form>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <aside class="rail">
      <div class="railtop">Bot state</div>
      <p class="railnote">This is what SlackOS is holding in Postgres. It changes as you type — that's the whole point of the thing.</p>

      <div class="row youcard" id="youCard"></div>

      <div class="counts">
        <div class="count"><b id="cT">0</b><span>Tasks</span></div>
        <div class="count"><b id="cM">0</b><span>Memory</span></div>
        <div class="count"><b id="cW">0</b><span>Rules</span></div>
      </div>

      <h3 class="sect">Automation rules</h3>
      <div class="rows" id="wRows"></div>

      <h3 class="sect">Tasks</h3>
      <div class="rows" id="tRows"></div>

      <h3 class="sect">Memory</h3>
      <div class="rows" id="mRows"></div>
    </aside>

  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------
   Seed data mirrors what is actually deployed on the live bot.
   ------------------------------------------------------------------ */

// The DM a new member actually receives. Same text as the live workflow row.
const HANDBOOK = `*Welcome to the team* 👋

Here's everything you need for your first week.

*Start here*
• Say hi in #bot-spam and tell us what you're working on
• Run \`/sos-help\` to see everything I can do
• Ask me anything with \`/sos-ask\` — I answer from the team's own notes

*How we work*
• Standup is 9am WAT every weekday in #standup
• We deploy on Fridays before 4pm — never over the weekend
• Every pull request needs at least one review before it can be merged
• Sprint planning is every other Monday at 4pm

*Where things live*
• Code — github.com/divinefavourak/jesutobi_bot-slack
• Tasks — run \`/sos-tasks\` and pick something up
• Decisions — run \`/sos-memories\`. If we decided it, I wrote it down

*Try me*
\`/sos-ask what did we decide about the database?\`
\`@SlackOS what time is standup?\`

Stuck on anything? Ask in the channel. Someone always answers.`;

const state = {
  tasks: [
    {id:2,  title:"Finish the UI",                      assignee:"Divine", due:"Friday",       status:"pending"},
    {id:3,  title:"Review the PR",                      assignee:"Tobi",   due:"today",        status:"pending"},
    {id:4,  title:"Look for his cloths",                assignee:"parker", due:null,           status:"pending"},
    {id:5,  title:"Design a landing page",              assignee:null,     due:"Thursday",     status:"pending"},
    {id:6,  title:"Write the API docs",                 assignee:null,     due:"next week",    status:"pending"},
    {id:7,  title:"Wire up the workflow engine",        assignee:"Divine", due:"last week",    status:"done"},
    {id:8,  title:"Deploy the bot to Nest",             assignee:"Divine", due:"today",        status:"done"},
    {id:9,  title:"Fix the mobile nav overflow",        assignee:"Ada",    due:"Monday",       status:"done"},
    {id:10, title:"Record the demo video",              assignee:"Divine", due:"Sunday",       status:"pending"},
    {id:11, title:"Set up CI for the bot",              assignee:"Tobi",   due:"next week",    status:"pending"},
    {id:12, title:"Write onboarding docs for new members", assignee:"Ada", due:"Friday",       status:"pending"},
    {id:13, title:"Ship v1 to the Slack marketplace",   assignee:null,     due:"end of month", status:"pending"},
    {id:14, title:"Add rate limiting to the AI engine", assignee:"Tobi",   due:null,           status:"pending"}
  ],
  memories: [
    {id:1,  content:"Decision about logo: use blue"},
    {id:2,  content:"Decision about mobile app: use React Native"},
    {id:3,  content:"Standup is at 9am WAT every weekday in #standup"},
    {id:4,  content:"We deploy on Fridays before 4pm — never over the weekend"},
    {id:5,  content:"Decision about the database: PostgreSQL in Docker, moving to Neon when we scale"},
    {id:6,  content:"Decision about AI: we use Groq with llama-3.3-70b because Hugging Face is blocked on our network"},
    {id:7,  content:"Every pull request needs at least one review before it can be merged"},
    {id:8,  content:"Our brand font is Inter and the accent colour is coral #E8705A"},
    {id:9,  content:"Decision about hosting: the bot runs on Hack Club Nest under systemd, not a PaaS"},
    {id:10, content:"Sprint planning is every other Monday at 4pm"}
  ],
  workflows: [
    {id:2, trigger:"channel_member_join", channel:"bot-spam", action:"send_message",
     label:"the short welcome",
     payload:"Glad you're here! Run `/sos-help` to see what I can do, and shout if you need anything.",
     enabled:false},
    {id:3, trigger:"channel_member_join", channel:"bot-spam", action:"dm_user",
     label:"the handbook",
     payload:HANDBOOK, enabled:true}
  ],
  nextTask:15, nextMem:11, nextFlow:4,

  // --- game layer ---
  you: { name:"You", xp:40, streak:3, shoutouts:0 },
  players: [
    { name:"Ada",    xp:520, streak:6 },
    { name:"Tobi",   xp:310, streak:2 },
    { name:"Divine", xp:180, streak:4 }
  ]
};

// Mirrors engines/gameEngine.js
const XP_PER_LEVEL = 100;
const TITLES = ["Lurker","Button Masher","Script Kiddie","Bug Whisperer","Merge Goblin",
                "Deploy Gremlin","Rubber Ducker","Stack Overlord","Ship Captain","Certified Menace"];
const levelFor = (xp) => Math.floor((xp||0)/XP_PER_LEVEL) + 1;
const titleFor = (lvl) => TITLES[Math.min(lvl, TITLES.length) - 1];
const xpToNext = (xp) => XP_PER_LEVEL - ((xp||0) % XP_PER_LEVEL);
const progressBar = (xp) => {
  const filled = Math.floor(((xp||0) % XP_PER_LEVEL) / (XP_PER_LEVEL/10));
  return "█".repeat(filled) + "░".repeat(10 - filled);
};

// Award XP to the player and report a level-up the way the real bot does.
function awardXp(amount, extra = {}) {
  const before = levelFor(state.you.xp);
  state.you.xp += amount;
  if (extra.shoutout) state.you.shoutouts++;
  const after = levelFor(state.you.xp);
  renderRail(); flash("#youCard");

  if (after > before) return `\n\n🎉 *+${amount} XP* — level *${after}*, _${titleFor(after)}_!`;
  return `\n\n_+${amount} XP${state.you.streak > 1 ? ` · ${state.you.streak} day streak 🔥` : ""}_`;
}

// Same 15 questions as the bot's offline bank.
const QUESTIONS = [
  ["What does 'HTTP' stand for?","HyperText Transfer Protocol",["HyperText Transmission Process","High Transfer Text Protocol","Hyperlink Text Transfer Path"],"easy"],
  ["Which company created JavaScript?","Netscape",["Microsoft","Sun Microsystems","Google"],"medium"],
  ["What does 'git commit' actually do?","Saves a snapshot to your local repository",["Uploads your code to GitHub","Creates a new branch","Merges two branches"],"easy"],
  ["In binary, what is 1010?","10",["8","12","20"],"easy"],
  ["What does 'CSS' stand for?","Cascading Style Sheets",["Computer Style Syntax","Creative Styling System","Cascading Syntax Sheets"],"easy"],
  ["Which of these is NOT a JavaScript data type?","Float",["Symbol","BigInt","Undefined"],"medium"],
  ["What port does HTTPS use by default?","443",["80","8080","22"],"medium"],
  ["What does 'API' stand for?","Application Programming Interface",["Applied Program Integration","Automated Process Invocation","Application Process Identifier"],"easy"],
  ["Who is credited with writing the first computer algorithm?","Ada Lovelace",["Alan Turing","Grace Hopper","Charles Babbage"],"medium"],
  ["Which HTTP status code means 'Too Many Requests'?","429",["404","500","403"],"hard"],
  ["What does 'DRY' stand for in programming?","Don't Repeat Yourself",["Do Rewrite Yearly","Debug Rapidly Yourself","Data Redundancy Yield"],"easy"],
  ["What is the default branch name Git uses today?","main",["master","trunk","default"],"easy"],
  ["What does 'RAM' stand for?","Random Access Memory",["Rapid Access Module","Read Access Memory","Runtime Allocated Memory"],"easy"]
];
const LETTERS = ["a","b","c","d"];
let openRound = null;

const EIGHT_BALL = [
  "It is certain.","Without a doubt.","Yes, obviously.","Signs point to yes.",
  "Ask again after you've pushed to main.","Reply hazy, try turning it off and on again.",
  "My sources say no.","Absolutely not.","Don't count on it.",
  "The compiler says no, and so do I.","Yes, but you'll regret it.",
  "Only if you write tests first.","That's a Friday deploy question. So no."
];

// The live bot generates these with Groq. The demo is static and keyless, so
// it picks from a list written in the same spirit: code habits, never people.
const ROASTS = [
  "you name every branch 'test2' and somehow always merge the wrong one.",
  "your commit message says 'fix' and it has 400 changed lines.",
  "you've got 47 browser tabs open and you're still googling 'how to center a div'.",
  "you write the tests after the deploy, like a gambler.",
  "your variable names are 'data', 'data2' and 'finalData'."
];
const HYPES = [
  "shipped it, tested it, and made it look easy. Go on then.",
  "turning up every single day is the whole trick, and you're doing it.",
  "that bug had no idea what was coming. Genuinely nice work.",
  "you made the hard part look boring, which is the highest compliment in software."
];
const pick1 = (arr) => arr[Math.floor(Math.random()*arr.length)];

const JOINERS = ["Ada","Kwame","Zainab","Chidi","Femi","Amara"];
let joinIdx = 0;

/* ---------------- rendering helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Slack mrkdwn subset, matching what the real bot emits.
function mrkdwn(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
    .replace(/_([^_\n]+)_/g, "<em>$1</em>")
    .replace(/&lt;@([^&]+)&gt;/g, '<span class="mention">@$1</span>');
}
const clock = () => new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});

function addMsg({who, name, text, foot, dm}){
  const el = document.createElement("div");
  el.className = "msg";
  const initials = who === "bot" ? "S" : name.slice(0,2).toUpperCase();
  el.innerHTML =
    `<div class="av ${who}">${esc(initials)}</div>
     <div class="body">
       <div class="who"><span class="name">${esc(name)}</span>
         ${who==="bot"?'<span class="badge">app</span>':""}
         <span class="time">${clock()}</span></div>
       ${dm ? `<div class="dm"><div class="dmlabel">Direct message · only ${esc(dm)} sees this</div><div class="text">${mrkdwn(text)}</div></div>`
            : `<div class="text">${mrkdwn(text)}</div>`}
       ${foot ? `<div class="foot">${mrkdwn(foot)}</div>` : ""}
     </div>`;
  $("log").appendChild(el);
  scroll();
}

function addEvent(text, live){
  const el = document.createElement("div");
  el.className = "evt" + (live ? " live" : "");
  el.innerHTML = `<span>${esc(text)}</span>`;
  $("log").appendChild(el);
  scroll();
}

function scroll(){ const l = $("log"); l.scrollTop = l.scrollHeight; }

function typing(ms){
  return new Promise(res => {
    const el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = `<div class="av bot">S</div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div>`;
    $("log").appendChild(el); scroll();
    setTimeout(() => { el.remove(); res(); }, ms);
  });
}

async function botSay(text, foot, dm){
  await typing(420 + Math.random()*260);
  addMsg({who:"bot", name:"SlackOS", text, foot, dm});
}

/* ---------------- state rail ---------------- */
// A payload can be a whole handbook; the rail only has room for a hint of it.
function preview(s){
  if(!s) return "no message";
  const flat = String(s).replace(/[*`_]/g,"").replace(/\s+/g," ").trim();
  return "“" + (flat.length > 34 ? flat.slice(0,34) + "…" : flat) + "”";
}

function flash(sel){
  const el = document.querySelector(sel);
  if(!el) return;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1100);
}

function renderRail(){
  const lvl = levelFor(state.you.xp);
  $("youCard").innerHTML =
    `<div class="lvl"><b>Level ${lvl} · ${esc(titleFor(lvl))}</b><span>${state.you.xp} XP</span></div>
     <div class="bar">${progressBar(state.you.xp)}</div>
     <div class="sub">${xpToNext(state.you.xp)} XP to next level` +
    `${state.you.streak > 1 ? ` · ${state.you.streak} day streak 🔥` : ""}` +
    `${state.you.shoutouts ? ` · ${state.you.shoutouts} shoutout${state.you.shoutouts>1?"s":""} 🏅` : ""}</div>`;

  $("cT").textContent = state.tasks.length;
  $("cM").textContent = state.memories.length;
  $("cW").textContent = state.workflows.length;

  $("wRows").innerHTML = state.workflows.length ? state.workflows.map(w =>
    `<div class="row" data-w="${w.id}">
       <span class="dot ${w.enabled?"on":"off"}"></span>
       <span class="id">#${w.id}</span>
       <span class="lbl"><span>${esc(w.action==="dm_user"?"DM the joiner":"Post in channel")}</span>
       <small>on join · #${esc(w.channel)} · ${esc(w.label || preview(w.payload))} · ${w.enabled?"enabled":"paused"}</small></span>
     </div>`).join("") : `<div class="empty">No rules.</div>`;

  const sorted = [...state.tasks].sort((a,b) => b.id - a.id);
  $("tRows").innerHTML = sorted.map(t =>
    `<div class="row ${t.status==="done"?"done":""}" data-t="${t.id}">
       <span class="dot ${t.status==="done"?"on":"pend"}"></span>
       <span class="id">#${t.id}</span>
       <span class="lbl"><span>${esc(t.title)}</span>
       <small>${esc(t.assignee||"Unassigned")}${t.due?" · "+esc(t.due):""}</small></span>
     </div>`).join("");

  $("mRows").innerHTML = state.memories.length ? [...state.memories].sort((a,b)=>b.id-a.id).map(m =>
    `<div class="row" data-m="${m.id}">
       <span class="id">#${m.id}</span>
       <span class="lbl"><span>${esc(m.content)}</span></span>
     </div>`).join("") : `<div class="empty">Nothing remembered yet.</div>`;
}

/* ---------------- command handling (mirrors router/eventRouter.js) ---------------- */
const parseId = (t) => { const m = String(t||"").match(/\d+/); return m ? Number(m[0]) : null; };

function listTasks(){
  const rows = [...state.tasks].sort((a,b) => b.id - a.id).map(t =>
    `${t.status==="done"?"✓":"•"} \`#${t.id}\` *${t.title}* — ${t.assignee||"Unassigned"} — ${t.due||"No deadline"} — _${t.status}_`
  ).join("\n");
  return "Here are your tasks:\n" + rows + "\n\n_Use `/sos-done <id>` when one is finished._";
}
function listMemories(){
  if(!state.memories.length) return "I haven't remembered anything yet. Try `/sos-ask remember that standup is at 9am`";
  return "Here's what I remember:\n" +
    [...state.memories].sort((a,b)=>b.id-a.id).map(m => `\`#${m.id}\` ${m.content}`).join("\n") +
    "\n\n_Use `/sos-forget <id>` to remove one._";
}
function listWorkflows(){
  if(!state.workflows.length) return "No workflows yet. Try `/sos-ask when someone joins #design, send onboarding docs`";
  return "Here are your workflows:\n" +
    state.workflows.map(w => `\`#${w.id}\` When *${w.trigger}* in #${w.channel}, ${w.action}${w.payload?` ("${w.payload}")`:""} — _${w.enabled?"enabled":"disabled"}_`).join("\n") +
    "\n\n_Use `/sos-workflows disable <id>` to pause one._";
}

// Stands in for the Groq intent call. The real bot classifies with an LLM;
// here we pattern-match so the page stays static and keyless.
function detectIntent(msg){
  const t = msg.toLowerCase();
  if(/\bwhen\s+(someone|somebody|anyone|a\s+\w+)\s+joins?\b|\bwhenever\b.*\bjoins?\b/.test(t)) return "create_workflow";
  if(/\b(remember|note that|don'?t forget|we decided|decision)\b/.test(t)) return "store_memory";
  if(/\b(remind|create a task|add a task|task for|needs? to|should)\b/.test(t)) return "create_task";
  if(/\?$|^(what|who|when|where|why|how|which|do we|are we|is there)\b/.test(t)) return "ask_question";
  return "ask_question";
}

function extractChannel(t){
  const m = t.match(/#([a-z0-9_\-]+)/i);
  return m ? m[1].toLowerCase() : null;
}

function handleAsk(msg){
  const intent = detectIntent(msg);

  if(intent === "create_workflow"){
    const channel = extractChannel(msg) || "bot-spam";
    const wantsDm = /\b(dm|direct message|privately|private message)\b/i.test(msg);
    let payload = null;
    const pm = msg.match(/\b(?:send|dm|share|give|post)\s+(?:them\s+)?(?:the\s+|a\s+|an\s+)?([a-z0-9 '’\-]+)$/i);
    if(pm) payload = pm[1].trim().replace(/\s+$/,"");
    const wf = {id:state.nextFlow++, trigger:"channel_member_join", channel,
                action: wantsDm ? "dm_user" : "send_message", payload: payload || null, enabled:true};
    state.workflows.push(wf);
    renderRail(); flash(`[data-w="${wf.id}"]`);
    const how = wf.action === "dm_user" ? "DM them" : "post a welcome in the channel";
    return `Workflow saved as \`#${wf.id}\`:\nWhen *channel_member_join* in #${channel}, I'll ${how}${wf.payload?` ("${wf.payload}")`:""}.`;
  }

  if(intent === "store_memory"){
    let content = msg
      .replace(/^\s*(please\s+)?(remember|note)\s+(that\s+)?/i, "")
      .replace(/^\s*don'?t forget\s+(that\s+)?/i, "")
      .trim();
    if(!content) content = msg.trim();
    content = content.charAt(0).toUpperCase() + content.slice(1);
    const mem = {id:state.nextMem++, content};
    state.memories.push(mem);
    renderRail(); flash(`[data-m="${mem.id}"]`);
    return `Got it. I'll remember that:\n_"${content}"_`;
  }

  if(intent === "create_task"){
    // "remind Divine to finish the UI by Friday and write docs by Monday"
    let body = msg.replace(/^\s*(please\s+)?remind\s+/i, "").trim();
    let assignee = null;
    const am = body.match(/^([A-Z][a-z]+)\s+to\s+/);
    if(am){ assignee = am[1]; body = body.slice(am[0].length); }
    else body = body.replace(/^(create|add)\s+a\s+task\s+(to\s+)?/i, "");

    const made = body.split(/\s+and\s+(?=[a-z])/i).map(chunk => {
      let due = null;
      const dm = chunk.match(/\bby\s+([a-z0-9 ]+?)\s*$/i);
      let title = chunk;
      if(dm){ due = dm[1].trim(); title = chunk.slice(0, dm.index).trim(); }
      title = title.replace(/[.?!]+$/,"").trim();
      if(!title) return null;
      const t = {id:state.nextTask++, title:title.charAt(0).toUpperCase()+title.slice(1),
                 assignee, due, status:"pending"};
      state.tasks.push(t); return t;
    }).filter(Boolean);

    if(!made.length) return "I detected a task but couldn't extract the details. Try being more specific.";
    renderRail(); made.forEach(t => flash(`[data-t="${t.id}"]`));
    const lines = made.map((t,i) => `${i+1}. *${t.title}* — ${t.assignee||"Unassigned"} — ${t.due||"No deadline"}`).join("\n");
    return `Got it. ${made.length} task${made.length>1?"s":""} saved:\n${lines}`;
  }

  // ask_question -> search memory the way the real bot does, then answer from it
  const stop = new Set(["what","when","who","how","why","where","which","did","do","does","we","the","a","an","is","are","our","about","for","to","of","on","in","at","decide","decided","time","and"]);
  const words = msg.toLowerCase().match(/[a-z0-9#]+/g) || [];
  const keys = words.filter(w => w.length > 2 && !stop.has(w));
  let best = null, bestScore = 0;
  for(const m of state.memories){
    const hay = m.content.toLowerCase();
    let score = 0;
    for(const k of keys) if(hay.includes(k)) score += k.length;
    if(score > bestScore){ bestScore = score; best = m; }
  }
  if(best && bestScore >= 4){
    flash(`[data-m="${best.id}"]`);
    return {text:`${best.content}.`, foot:"📌 Based on saved memory"};
  }
  return "I don't have anything saved about that yet. Tell me with `/sos-ask remember that ...` and I'll keep it.";
}

/* ---------------- the event trigger — the part a screenshot can't show ---------------- */
async function simulateJoin(){
  const person = JOINERS[joinIdx++ % JOINERS.length];
  addEvent(`${person} joined #bot-spam`, true);

  const matches = state.workflows.filter(w =>
    w.trigger === "channel_member_join" && w.channel === "bot-spam" && w.enabled);

  if(!matches.length){
    await typing(380);
    addEvent("no enabled rule matched — bot stays quiet");
    return;
  }

  for(const w of matches){
    flash(`[data-w="${w.id}"]`);
    // Same composition rule as the real bot: long or multi-line payloads get
    // their own block instead of running on from the greeting.
    const body = w.payload || "Glad to have you here.";
    const text = (body.includes("\n") || body.length > 60)
      ? `Welcome <@${person}>!\n\n${body}`
      : `Welcome <@${person}>! ${body}`;
    if(w.action === "dm_user") await botSay(text, null, person);
    else await botSay(text);
  }
}

function formatRound(r){
  return `🧠 *Trivia* _(${r.difficulty})_\n${r.question}\n\n` +
         r.options.map((o,i) => `${LETTERS[i]}) ${o}`).join("\n") +
         "\n\n_Answer with_ `/sos-answer a`";
}

// The live bot pulls a real meme from meme-api.com. This page is static, so it
// tries the same API and falls back to a caption if the browser blocks it --
// a broken image icon is a worse demo than no image at all.
// r/ProgrammerHumor titles are camelCase by convention, so split them back
// into words before showing. Mirrors funEngine.humanizeTitle.
function humanizeTitle(t){
  if(!t) return "Meme";
  let s = String(t);
  if(!/\s/.test(s) && /[a-z][A-Z]/.test(s)){
    s = s.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2");
  }
  return s.charAt(0).toUpperCase() + s.slice(1);
}

async function showMeme(){
  await typing(500);
  try {
    const res = await fetch("https://meme-api.com/gimme/ProgrammerHumor", { signal: AbortSignal.timeout(6000) });
    const m = await res.json();
    if(m && m.url && !m.nsfw && !m.spoiler && /\.(jpg|jpeg|png|gif)$/i.test(m.url)){
      const el = document.createElement("div");
      el.className = "msg";
      el.innerHTML =
        `<div class="av bot">S</div>
         <div class="body">
           <div class="who"><span class="name">SlackOS</span><span class="badge">app</span><span class="time">${clock()}</span></div>
           <div class="text"><strong>${esc(humanizeTitle(m.title))}</strong><br><em>r/${esc(m.subreddit)}</em></div>
           <img src="${esc(m.url)}" alt="${esc(humanizeTitle(m.title))}" class="memeimg" loading="lazy">
         </div>`;
      $("log").appendChild(el); scroll();
      return;
    }
  } catch (err) {
    console.log("meme fetch unavailable:", err.message);
  }
  addMsg({ who:"bot", name:"SlackOS",
    text:"*When the tests pass on the first try*\n_r/ProgrammerHumor_",
    foot:"The live bot posts the actual image. This page can't always reach the meme API from a browser." });
}

/* ---------------- dispatcher ---------------- */
async function run(raw){
  const input = raw.trim();
  if(!input) return;

  const isCmd = input.startsWith("/");
  const isMention = /^@slackos\b/i.test(input);
  addMsg({who:"you", name:"You", text:input});

  if(isMention){
    const q = input.replace(/^@slackos\b/i,"").trim();
    if(!q){ await botSay("Hey! Ask me something, e.g. `@SlackOS what's our standup time?` — or run `/sos-help`."); return; }
    const r = handleAsk(q);
    await botSay(typeof r === "string" ? r : r.text, typeof r === "string" ? null : r.foot);
    return;
  }

  if(!isCmd){
    await botSay("I only listen to slash commands and @mentions in a channel. Try `/sos-help`, or `@SlackOS what's our standup time?`");
    return;
  }

  const [cmd, ...rest] = input.split(/\s+/);
  const arg = rest.join(" ");

  switch(cmd.toLowerCase()){
    case "/sos-help":
      await botSay(
        "*Tasks*\n`/sos-tasks` list · `/sos-done <id>` finish · `/sos-reopen <id>` reopen\n\n" +
        "*Memory*\n`/sos-memories` list · `/sos-forget <id>` delete\n\n" +
        "*Workflows*\n`/sos-workflows` list · `/sos-workflows enable|disable|delete <id>`\n\n" +
        "*Games*\n`/sos-trivia` · `/sos-answer a` · `/sos-rank` · `/sos-leaderboard` · `/sos-shoutout @ada`\n\n" +
        "*Fun*\n`/sos-meme` · `/sos-roast` · `/sos-hype` · `/sos-8ball`\n\n" +
        "*Natural language*\n`/sos-ask <anything>` — creates tasks, answers questions, saves memories, builds automations\n\n" +
        "*For fun*\n`/sos-joke` · `/sos-meow-fact` · `/sos-no` · `/sos-ping`\n\n" +
        "You can also just `@SlackOS` me in a channel.");
      break;

    case "/sos-tasks": await botSay(listTasks()); break;
    case "/sos-memories": await botSay(listMemories()); break;
    

    case "/sos-done": case "/sos-reopen": {
      const id = parseId(arg);
      const want = cmd.toLowerCase() === "/sos-done" ? "done" : "pending";
      if(!id){ await botSay(`Which task? Use \`${cmd} <id>\` — run \`/sos-tasks\` to see the ids.`); break; }
      const t = state.tasks.find(x => x.id === id);
      if(!t){ await botSay(`I couldn't find task \`#${id}\`. Run \`/sos-tasks\` to see the ids.`); break; }
      const wasDone = t.status === "done";
      t.status = want; renderRail(); flash(`[data-t="${id}"]`);
      if(want !== "done"){ await botSay(`*${t.title}* is back to _pending_.`); break; }
      // Re-completing an already-done task pays nothing, same as the real bot.
      await botSay(`Nice. *${t.title}* is done.` + (wasDone ? "" : awardXp(10)));
      break;
    }

    case "/sos-forget": {
      const id = parseId(arg);
      if(!id){ await botSay("Which memory? Use `/sos-forget <id>` — run `/sos-memories` to see the ids."); break; }
      const i = state.memories.findIndex(m => m.id === id);
      if(i < 0){ await botSay(`I couldn't find memory \`#${id}\`. Run \`/sos-memories\` to see the ids.`); break; }
      const [gone] = state.memories.splice(i,1); renderRail();
      await botSay(`Forgotten:\n_"${gone.content}"_`);
      break;
    }

    // Bare -> list. With a verb -> manage. One command, so a missing "s"
    // can't silently run a different one.
    case "/sos-workflows": {
      if(!arg){ await botSay(listWorkflows()); break; }
      const op = (rest[0]||"").toLowerCase();
      const id = parseId(arg);
      if(!["enable","disable","delete"].includes(op)){
        await botSay("Usage: `/sos-workflows` to list, or `/sos-workflows enable|disable|delete <id>` to manage one."); break;
      }
      if(!id){ await botSay(`Which workflow? Use \`/sos-workflows ${op} <id>\` — run \`/sos-workflows\` to see the ids.`); break; }
      const i = state.workflows.findIndex(w => w.id === id);
      if(i < 0){ await botSay(`I couldn't find workflow \`#${id}\`. Run \`/sos-workflows\` to see the ids.`); break; }
      if(op === "delete"){
        const [gone] = state.workflows.splice(i,1); renderRail();
        await botSay(`Deleted workflow \`#${gone.id}\` (was: *${gone.trigger}* in #${gone.channel}).`);
      } else {
        state.workflows[i].enabled = (op === "enable"); renderRail(); flash(`[data-w="${id}"]`);
        await botSay(op === "enable"
          ? `Workflow \`#${id}\` is active again — I'll watch #${state.workflows[i].channel}.`
          : `Workflow \`#${id}\` is paused. It won't fire until you re-enable it.`);
      }
      break;
    }

    case "/sos-ask": {
      if(!arg){ await botSay("Type something after `/sos-ask`. Example: `/sos-ask remind Divine to finish the UI by Friday`"); break; }
      const r = handleAsk(arg);
      await botSay(typeof r === "string" ? r : r.text, typeof r === "string" ? null : r.foot);
      break;
    }

    // ---------- games ----------
    case "/sos-trivia": {
      if(openRound){ await botSay(`There's already a question on the table:\n\n${formatRound(openRound)}`); break; }
      const [question, correct, wrong, difficulty] = pick1(QUESTIONS);
      const options = [correct, ...wrong].map(o=>o);
      for(let i=options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }
      openRound = { question, options, correctIndex: options.indexOf(correct), difficulty };
      await botSay(formatRound(openRound));
      break;
    }

    case "/sos-answer": {
      if(!arg){ await botSay("Answer with a letter, like `/sos-answer b`."); break; }
      if(!openRound){ await botSay("No question running here. Start one with `/sos-trivia`."); break; }
      const guess = arg.trim().toLowerCase().replace(/[).:]$/,"");
      let idx = LETTERS.indexOf(guess);
      if(idx === -1) idx = openRound.options.findIndex(o => o.toLowerCase() === guess);
      if(idx === -1){ await botSay("That's not one of the options. Answer with `a`, `b`, `c` or `d`."); break; }
      const round = openRound; openRound = null;
      if(idx === round.correctIndex){
        await botSay(`✅ *${round.options[round.correctIndex]}* is right!` + awardXp(20));
      } else {
        await botSay(`❌ Not quite — you said *${round.options[idx]}*. The answer was *${round.options[round.correctIndex]}*.\nAnother one? \`/sos-trivia\``);
      }
      break;
    }

    case "/sos-rank": {
      const lvl = levelFor(state.you.xp);
      const ahead = state.players.filter(p => p.xp > state.you.xp).length;
      await botSay(
        `*You* — level ${lvl}, _${titleFor(lvl)}_\n` +
        `\`${progressBar(state.you.xp)}\`  ${state.you.xp} XP · ${xpToNext(state.you.xp)} to next level\n` +
        `Rank *#${ahead + 1}* of ${state.players.length + 1}` +
        `${state.you.streak > 1 ? ` · ${state.you.streak} day streak 🔥` : ""}` +
        `${state.you.shoutouts ? ` · ${state.you.shoutouts} shoutout${state.you.shoutouts>1?"s":""} 🏅` : ""}`);
      break;
    }

    case "/sos-leaderboard": {
      const all = [...state.players, {name:"You", xp:state.you.xp, streak:state.you.streak}]
        .sort((a,b) => b.xp - a.xp);
      const medals = ["🥇","🥈","🥉"];
      await botSay("*Leaderboard*\n" + all.map((p,i) => {
        const lvl = levelFor(p.xp);
        const mark = medals[i] || `${String(i+1).padStart(2," ")}.`;
        return `${mark} *${p.name}* — ${p.xp} XP · lvl ${lvl} _${titleFor(lvl)}_${p.streak>1?` · ${p.streak}🔥`:""}`;
      }).join("\n") + "\n\n_See your own standing with_ `/sos-rank`");
      break;
    }

    case "/sos-shoutout": {
      const who = (arg.match(/@([\w.\-]+)/)||[])[1];
      if(!who){ await botSay("Who deserves it? Try `/sos-shoutout @ada for fixing the nav bug`."); break; }
      const why = arg.replace(/@[\w.\-]+/,"").replace(/^\s*(for|because)\s+/i,"").trim();
      const target = state.players.find(p => p.name.toLowerCase() === who.toLowerCase());
      if(target) target.xp += 25;
      await botSay(`🏅 Shoutout to *@${who}*${why ? " " + why : ""}\n_from <@You>_` + awardXp(5));
      break;
    }

    // ---------- fun ----------
    case "/sos-meme": await showMeme(); break;

    case "/sos-8ball":
      await botSay(arg ? `🎱 *${arg}*\n${pick1(EIGHT_BALL)}` : `🎱 ${pick1(EIGHT_BALL)}`);
      break;

    case "/sos-roast": {
      const who = (arg.match(/@([\w.\-]+)/)||[])[1];
      await botSay(`🔥 ${who ? `@${who}, ` : ""}${pick1(ROASTS)}`);
      break;
    }

    case "/sos-hype": {
      const who = (arg.match(/@([\w.\-]+)/)||[])[1];
      await botSay(`⚡ ${who ? `@${who} ` : ""}${pick1(HYPES)}`);
      break;
    }

    case "/sos-joke": await botSay("Why did the developer go broke?\nBecause he used up all his cache."); break;
    case "/sos-meow-fact": await botSay("Cat fact: A group of cats is called a clowder."); break;
    case "/sos-no": await botSay("Here's a silly excuse for you: The Wi-Fi was down in my heart."); break;
    case "/sos-ping": await botSay(`Pong! Latency: ${8 + Math.floor(Math.random()*40)}ms`); break;

    default:
      await botSay(`I don't know \`${cmd}\` yet. Run \`/sos-help\` to see what I can do.`);
  }
}

/* ---------------- suggestion chips ---------------- */
const CHIPS = [
  {label:"⚡ someone joins #bot-spam", fire:true, run:simulateJoin},
  {label:"/sos-trivia", text:"/sos-trivia"},
  {label:"/sos-meme", text:"/sos-meme"},
  {label:"/sos-leaderboard", text:"/sos-leaderboard"},
  {label:"/sos-done 10", text:"/sos-done 10"},
  {label:"/sos-roast @tobi", text:"/sos-roast @tobi"},
  {label:"/sos-tasks", text:"/sos-tasks"},
  {label:"/sos-ask what did we decide about the logo?", text:"/sos-ask what did we decide about the logo?"},
  {label:"/sos-help", text:"/sos-help"}
];

let busy = false;
async function guard(fn){
  if(busy) return;
  busy = true; $("send").disabled = true;
  try { await fn(); } finally { busy = false; $("send").disabled = false; $("input").focus(); }
}

$("chips").innerHTML = CHIPS.map((c,i) =>
  `<button class="chip ${c.fire?"fire":""}" data-i="${i}" type="button">${esc(c.label)}</button>`).join("");

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  const c = CHIPS[Number(b.dataset.i)];
  guard(() => c.run ? c.run() : run(c.text));
});

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("input").value;
  $("input").value = "";
  guard(() => run(v));
});

/* ---------------- opening sequence ---------------- */
renderRail();
(async () => {
  addEvent("SlackOS was added to #bot-spam");
  await botSay(
    "I'm SlackOS. Say what you want in plain english and I'll do it — no forms.\n\n" +
    "Try `/sos-tasks`, or ask me `@SlackOS what's our standup time?`\n\n" +
    "The real trick is the ⚡ button below: it simulates someone joining this channel, and I react on my own.",
    "Everything on the right is my live state. Watch it change as you type."
  );
})();
